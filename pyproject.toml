[project]
name = "chessfoundation"
version = "0.1.0"
description = "Small distilled chess network with Gumbel search, tuned for bullet"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "python-chess>=1.999",
  "pyarrow>=15",
  "huggingface-hub>=0.24",
]

[project.scripts]
chessfoundation = "chessfoundation.engine.model_engine:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
